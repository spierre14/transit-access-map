<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Access Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="map-wrap">
  <div id="map"></div>
  <div class="map-loading" id="mapLoading">Loading data&hellip;</div>

  <button class="panel-toggle-float" id="panelToggle" aria-label="Toggle panel">&#9776;</button>

  <aside class="floating-panel" id="panel">
    <h1>Transit Access Map</h1>

    <select id="metricSelect" class="metric-select">
      <optgroup label="Jobs Access">
        <option value="jobs_full">Full Service</option>
        <option value="jobs_limited">Limited Fare</option>
      </optgroup>
      <optgroup label="Land Area Access">
        <option value="land_full">Full Service</option>
        <option value="land_full_night">Full Service (Nighttime)</option>
        <option value="land_limited">Limited Fare</option>
      </optgroup>
    </select>

    <div id="legend">
      <!-- populated by js/app.js based on the selected metric -->
    </div>
  </aside>
</main>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
